# Application configuration template.
# Copy to config.yaml (gitignored) and adjust for your environment.
# Env overrides: APP_PORT, MONGO_URI, MONGO_DB, ETHORA_API_KEY, ETHORA_API_SECRET,
# ETHORA_XMPP_WS_URL, JWT_SECRET, CORS_ALLOWED_ORIGINS.
server:
  port: 8080
  # Browser origins allowed to call the API cross-origin (so the SPA needs no
  # dev proxy). Use "*" to allow any origin (disables credentials). Override
  # with CORS_ALLOWED_ORIGINS (comma-separated).
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

mongo:
  uri: mongodb://root:example@localhost:27017
  database: protected_server

# Ethora API credentials (https://ethora.com); keep real values out of git
ethora:
  base_url: https://api.chat.ethora.com/
  api_key: your-api-key
  api_secret: your-api-secret
  # XMPP websocket endpoint the system account connects to at server startup
  xmpp_ws_url: wss://xmpp.chat.ethora.com/ws

# Signing key for the access tokens register/login hand out. No default —
# the server refuses to start without it. Generate one with:
#   openssl rand -hex 32
auth:
  jwt_secret: your-jwt-secret
